# set tmux position
set-option -g status-position top

# improve colors
set -g default-terminal "tmux-256color"
# set -g default-terminal "${TERM}"
set -ga terminal-overrides ",*256col*:Tc"

# act like vim
setw -g mode-keys vi

# Below two lines have conficts with panne selction
# bind -r C-h select-window -t :-
# bind -r C-l select-window -t :+

bind-key m copy-mode        # enter copy mode
bind-key v paste-buffer     # paste content
bind-key -T copy-mode-vi "v" send -X begin-selection
bind-key -T copy-mode-vi "V" send -X rectangle-toggle
bind-key -T copy-mode-vi "y" send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# act like GNU screen
unbind C-b
set -g prefix C-a
bind-key C-a send-key C-a

bind Space select-pane -t :.+

# create new windows/panes in same directory
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# bind-key = select-layout even-horizontal
bind-key = select-layout tiled

# quit window
unbind x
bind-key X kill-pane
# bind-key Q kill-window
# bind K confirm kill-window

# enable and disable keyboard input for panes
bind < select-pane -d \; display-message "input disabled"
bind > select-pane -e \; display-message "input enabled"

# size windows based on clients looking at that window
setw -g aggressive-resize on

# enable mouse control
set -g mouse on

# start window numbers at 1 to match keyboard order with tmux order
set -g base-index 1

# start pane numbers at 2 to match keyboard order with tmux order
setw -g pane-base-index 1

# easy resizing of panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

bind-key M-h swap-pane -t left
bind-key M-l swap-pane -t right
bind-key M-j swap-pane -t down
bind-key M-k swap-pane -t up

bind-key M-h swap-pane -t '{left}'
bind-key M-l swap-pane -t '{right}'
bind-key M-j swap-pane -t '{down}'
bind-key M-k swap-pane -t '{up}'

bind-key z resize-pane -Z \; refresh-client -S


set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour39 bold],#[fg=colour245 dim]} ● #P  #T  #{pane_current_command}  #{pane_current_path} "
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour39"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# reenable automatic renaming for the current window
bind N setw automatic-rename on \; display-message "automatic rename enabled"

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# monitor windows for activity
setw -g monitor-activity on

# don't wait for escape sequences
set -sg escape-time 0

# display pane numbers for longer
set -g display-panes-time 2000

# increase scrollback lines
set -g history-limit 65536
set -g focus-events on

bind S setw synchronize-panes \; display-message "sync: #{?pane_synchronized,on,off}"
bind-key t display-popup -E -w 80% -h 80% "tmux new-session -A -s popup"

set -g set-titles on
set -g set-titles-string "#S / #W"




# keybinding to clear history
bind C-k clear-history \; display-message "history cleared"

# C-b ! breaks current pane into separate window
# join a pane/window from the current session into the current window
bind @ command-prompt -p "create pane from:" "join-pane -s ':%%'"

# reload the .tmux.conf file with Ctrl-r
bind C-r source-file ~/.tmux.conf \; display-message "configuration reloaded"

# toggle passthrough of prefix
bind P if-shell "[ \"$(tmux show-options -g prefix)\" = \"prefix C-a\" ]" '\
    set -g prefix C-b; display-message "passthrough enabled"; refresh-client -S; \
    ' '\
    set -g prefix C-a; display-message "passthrough disabled"; refresh-client -S; \
    '

# pane number display
set -g display-panes-active-colour colour166 #blue
set -g display-panes-colour colour33 #orange

# Update config
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind-key e display-popup -E "tmux choose-session"
bind-key t display-popup -E "tmux attach -t popup || tmux new -s popup"

# Allow local customization in ~/.tmux_local.conf
if-shell "[ -f ~/.tmux_local.conf ]" 'source ~/.tmux_local.conf'

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -gq allow-passthrough on
set -g visual-activity off

set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-last-style default

# plugins
source "~/.config/tmux/plugins.conf"

# Show a transient indicator after pressing the tmux prefix key.
set -g status-left-length 80
set -g status-left '#{?client_prefix,#[fg=black,bg=yellow,bold] PREFIX #[default],}#(~/.config/tmux/plugins/tmux-powerline/powerline.sh left)'
